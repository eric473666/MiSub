[custom]
; MiSub stable daily Clash template.
; Updated: 2026-08-28 rev28-main-pool-and-uscox1-relay
;
; Principles:
; - Follow the mainstream ACL4SSR/MiSub flow: LAN -> conservative ads -> special services
;   -> generic proxy list -> China direct -> one proxy fallback.
; - Keep one consistent default route for normal overseas pages and their third-party assets.
; - Service groups default back to the main route unless a regional exit is truly required.
; - Auto/fallback groups test real daily nodes directly; they do not test nested strategy groups.
; - Hong Kong daily use tests VMISS, LazyCat, and HK alternatives directly; the lowest-latency
;   healthy node wins with a small anti-flap tolerance.
; - The Singapore node whose name contains "奶爸" participates in the main auto/fallback pool.
; - USCOX1 is exposed only through its DMIT relay name in the US landing group; its direct
;   node is intentionally excluded.
; - Keep useful AI, PikPak, Google Play, regional media, academic, and download categories.
; - Do not force overseas banks, shopping, travel, government, fonts, or shared CDNs to DIRECT
;   or to a fixed residential exit.
; - Keep DNS close to the common MiSub/J8 profile: Fake-IP plus direct Ali/Tencent DoH.

clash_rule_base=https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/GeneralClashConfig.yml
enable_rule_generator=true
overwrite_original_rules=true

