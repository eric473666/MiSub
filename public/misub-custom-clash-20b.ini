[custom]
; MiSub / SubConverter custom Clash template.
; Updated: 2026-07-01 rev20b-pikpak1
;
; Design:
; - Keep node subscriptions updated by MiSub.
; - Proxy groups use regex selectors, then MiSub expands them to static Clash members.
; - Manual switch must include every generated node without emitting Clash filter fields.
; - Prefer LA datacenter routes for social/media feeds; their CDN tail latency is lower than HK.
; - Keep HK as a low-latency fallback and Android download path where it is still useful.
; - AI groups intentionally exclude Daily Auto so selected AI exits stay sticky; default AI exit is US.
; - Residential exits are grouped by place plus one total pool; only use them for explicit unlock or rescue.
; - AI is split into general AI, voice/narration, and video-generation groups before Google/Microsoft.
; - Domestic app/account/O2O traffic gets an early DIRECT guard before ad/proxy lists.
; - MetaCubeX mrs rule-sets are used only where Mihomo benefits from domain/ipcidr coverage.
; - Variant 20b rejects common WebRTC STUN/TURN discovery domains and ports before proxy rules.
; - Keep broad Google shared domains after AI so Gemini/OpenAI helpers are not routed through HK.
; - HKG-LazyCat is a HK direct candidate only; do not use it as transit or put it in residential pools.
; - PikPak has a dedicated early group so region checks do not fall through to China DIRECT.

clash_rule_base=https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/GeneralClashConfig.yml
enable_rule_generator=true
overwrite_original_rules=true

