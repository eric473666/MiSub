[custom]
; MiSub / SubConverter custom Clash template.
; Updated: 2026-06-14 rev9
;
; Design:
; - Keep node subscriptions updated by MiSub.
; - Proxy groups use regex selectors, then MiSub expands them to static Clash members.
; - Manual switch must include every generated node without emitting Clash filter fields.
; - LA datacenter routes combine BWH and DMIT, then url-test picks the fastest current path.
; - Daily auto compares LA datacenter and HK routes, then uses the fastest current path.
; - AI groups intentionally exclude Daily Auto so selected AI exits stay sticky; default AI exit is TW.
; - Residential exits are grouped by place plus one total pool; only use them for explicit unlock or rescue.
; - AI is split into general AI, voice/narration, and video-generation groups before Google/Microsoft.

clash_rule_base=https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/GeneralClashConfig.yml
enable_rule_generator=true
overwrite_original_rules=true

