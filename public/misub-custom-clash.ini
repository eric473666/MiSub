[custom]
; MiSub / SubConverter custom Clash template.
; Updated: 2026-06-10 rev2
;
; Design:
; - Keep node subscriptions updated by MiSub.
; - Daily traffic prefers DMIT + cheap low-latency HK-ZGO.
; - ZG-LA-Reality is kept as a slow fallback only.
; - Residential Mini-home nodes are only used for explicit regional unlock.
; - US-Mini-home is the default Disney+ unlock node, because Disney is node-sensitive.

clash_rule_base=https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/GeneralClashConfig.yml
enable_rule_generator=true
overwrite_original_rules=true

