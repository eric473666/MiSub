[custom]
; MiSub / SubConverter custom Clash template.
; Updated: 2026-06-12 rev3
;
; Design:
; - Keep node subscriptions updated by MiSub.
; - Proxy groups use regex selectors, then MiSub expands them to static Clash members.
; - Manual switch must include every generated node without emitting Clash filter fields.
; - Daily traffic prefers DMIT + HK-VMISS; ZGO is only transition/fallback.
; - Download-heavy traffic prefers BWD first while it stays fast.
; - US-Mini-home is an explicit last-resort residential unlock node because it can drop.
; - JP/TW residential exits are only used for explicit regional unlock.

clash_rule_base=https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/GeneralClashConfig.yml
enable_rule_generator=true
overwrite_original_rules=true

