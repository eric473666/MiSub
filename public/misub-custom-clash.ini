[custom]
; MiSub / SubConverter custom Clash template.
; Use this as MiSub's subConfig/config URL.
;
; Goal:
; - Keep nodes updated by MiSub subscriptions.
; - Generate detailed rules for iPhone/Proxy-WiFi usage.
; - Keep payment, bank, carrier, healthcare, China apps direct.
; - Put AI before generic Google/Microsoft rules.

clash_rule_base=https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/GeneralClashConfig.yml
enable_rule_generator=true
overwrite_original_rules=true

; -----------------------------
; Rule order
; -----------------------------

; LAN/private
ruleset=DIRECT,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Lan/Lan.list
ruleset=DIRECT,[]DOMAIN,localhost
ruleset=DIRECT,[]DOMAIN-SUFFIX,local
ruleset=DIRECT,[]DOMAIN-SUFFIX,lan
ruleset=DIRECT,[]IP-CIDR,0.0.0.0/8,no-resolve
ruleset=DIRECT,[]IP-CIDR,10.0.0.0/8,no-resolve
ruleset=DIRECT,[]IP-CIDR,100.64.0.0/10,no-resolve
ruleset=DIRECT,[]IP-CIDR,127.0.0.0/8,no-resolve
ruleset=DIRECT,[]IP-CIDR,169.254.0.0/16,no-resolve
ruleset=DIRECT,[]IP-CIDR,172.16.0.0/12,no-resolve
ruleset=DIRECT,[]IP-CIDR,192.168.0.0/16,no-resolve
